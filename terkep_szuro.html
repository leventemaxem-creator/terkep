<title>Közép-európai szűrőtérkép</title>
<style>
:root{
  --bg:#ECEFF3; --paper:#FFFFFF; --ink:#14213D; --muted:#56637A; --rule:#D3DAE4;
  --hover:#DCE8F7; --selected:#1B5CC0; --selected-fill:#B5D0F0; --accent:#1B5CC0;
  color-scheme: light dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131D; --paper:#141B29; --ink:#DCE5F5; --muted:#8F9DB6; --rule:#28324A;
    --hover:#1F2F4A; --selected:#86B4FF; --selected-fill:#2B4E82; --accent:#86B4FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131D; --paper:#141B29; --ink:#DCE5F5; --muted:#8F9DB6; --rule:#28324A;
  --hover:#1F2F4A; --selected:#86B4FF; --selected-fill:#2B4E82; --accent:#86B4FF;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0; padding:0; background:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif; overflow:hidden}
#wrap{max-width:720px; margin:0 auto; background:var(--paper)}
#map{display:block; width:100%; height:auto; aspect-ratio:752 / 962.8}
.country{
  fill:var(--paper); stroke:var(--ink); stroke-width:1.3; stroke-linejoin:round; vector-effect:non-scaling-stroke;
  cursor:pointer; outline:none; transition:fill .12s ease;
}
.country:hover{fill:var(--hover)}
.country.is-selected{fill:var(--selected-fill); stroke:var(--selected); stroke-width:2.4}
.country:focus-visible{stroke:var(--accent); stroke-width:2.6}
.lbl{
  font-weight:700; fill:var(--ink); text-anchor:middle; dominant-baseline:central; pointer-events:none;
  paint-order:stroke; stroke:var(--paper); stroke-width:3.4px; stroke-linejoin:round; stroke-opacity:.85;
  font-size:16.75px; letter-spacing:.01em;
}
.country.is-selected ~ .lbl{} /* no-op, keeps labels above all fills via DOM order */

    HU: {hu:'Magyarország',  pl:'Węgry',     cs:'Maďarsko', sk:'Maďarsko',  de:'Ungarn',     hr:'Mađarska',  sl:'Madžarska'},
    AT: {hu:'Ausztria',      pl:'Austria',   cs:'Rakousko', sk:'Rakúsko',   de:'Österreich', hr:'Austrija',  sl:'Avstrija'},
    HR: {hu:'Horvátország',  pl:'Chorwacja', cs:'Chorvatsko',sk:'Chorvátsko',de:'Kroatien',  hr:'Hrvatska',  sl:'Hrvaška'},
    SI: {hu:'Szlovénia',     pl:'Słowenia',  cs:'Slovinsko',sk:'Slovinsko', de:'Slowenien',  hr:'Slovenija', sl:'Slovenija'}
  };
  var SUPPORTED = ['hu','pl','cs','sk','de','hr','sl'];

  var svg = document.getElementById('map');
  var countries = Array.prototype.slice.call(svg.querySelectorAll('.country'));
  var labelEls = {};
  Array.prototype.slice.call(svg.querySelectorAll('.lbl')).forEach(function(t){
    labelEls[t.getAttribute('data-id')] = t;
  });

  var selected = null;
  var currentLang = 'hu';

  function applyLang(lang){
    if(SUPPORTED.indexOf(lang) === -1) lang = 'hu';
    currentLang = lang;
    Object.keys(labelEls).forEach(function(id){
      labelEls[id].textContent = NAMES[id][lang] || NAMES[id].hu;
    });
  }

  function post(payload){
    try{ window.parent.postMessage(Object.assign({source:'kontur-terkep'}, payload), '*'); }catch(e){}
  }

  function select(id){
    // toggle: clicking the already-selected country clears the filter
    selected = (selected === id) ? null : id;
    countries.forEach(function(c){
      c.classList.toggle('is-selected', c.getAttribute('data-id') === selected);
    });
    post({type:'country-select', country: selected});
  }

  countries.forEach(function(c){
    c.addEventListener('click', function(){ select(c.getAttribute('data-id')); });
    c.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(c.getAttribute('data-id')); }
    });
  });

  // ---- initial language: from ?lang= URL param ----
  var params = new URLSearchParams(window.location.search);
  applyLang(params.get('lang') || 'hu');

  // ---- theme: default to OS preference, but let the host page override it ----
  function applyTheme(theme){
    if(theme === 'dark' || theme === 'light'){
      document.documentElement.setAttribute('data-theme', theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  // ---- let the host page change language/theme or clear the selection without reloading the iframe ----
  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'set-lang'){ applyLang(d.lang); }
    if(d.type === 'set-theme'){ applyTheme(d.theme); }
    if(d.type === 'clear-selection'){ select(null); selected = null; countries.forEach(function(c){c.classList.remove('is-selected');}); }
  });

  // ---- tell the host page our actual rendered height, so it can size the iframe to fit (no scrollbar, no empty gap) ----
  var wrap = document.getElementById('wrap');
  function reportSize(){
    post({type:'resize', height: Math.ceil(wrap.getBoundingClientRect().height)});
  }
  if(window.ResizeObserver){ new ResizeObserver(reportSize).observe(wrap); }
  else { window.addEventListener('resize', reportSize); }

  // let the host page know the widget is ready (host can reply with initial theme)
  post({type:'ready'});
  reportSize();
})();
</script>
</body>
</html>
